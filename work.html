    <script>
        // Fade-on-scroll Logic
        const faders = document.querySelectorAll('.fade-section');
        const appearOptions = {
            threshold: 0.1,
            rootMargin: "0px 0px 0px 0px"
        };
        const appearOnScroll = new IntersectionObserver(function(entries, observer) {
            entries.forEach(entry => {
                if (!entry.isIntersecting) {
                    return;
                } else {
                    entry.target.classList.add('fade-visible');
                    observer.unobserve(entry.target);
                }
            });
        }, appearOptions);

        faders.forEach(fader => {
            appearOnScroll.observe(fader);
        });

        // Carousel Logic
        const track = document.querySelector('.work-carousel-track');
        if(track) {
            const slides = document.querySelectorAll('.work-carousel-slide');
            const prevButton = document.querySelector('.carousel-arrow.prev');
            const nextButton = document.querySelector('.carousel-arrow.next');
            let currentSlideIndex = 0;

            function updateCarousel() {
                track.style.transform = `translateX(-${currentSlideIndex * 100}%)`;
            }

            prevButton.addEventListener('click', () => {
                currentSlideIndex = (currentSlideIndex === 0) ? slides.length - 1 : currentSlideIndex - 1;
                updateCarousel();
            });

            nextButton.addEventListener('click', () => {
                currentSlideIndex = (currentSlideIndex === slides.length - 1) ? 0 : currentSlideIndex + 1;
                updateCarousel();
            });
        }
    </script>
